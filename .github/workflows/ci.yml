# Based on the sample workflow for building and deploying a Hugo site to GitHub Pages
name: Build Hugo site

on:
  # Build on all PRs
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Allow one concurrent build per PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hugo: [0.146.2, 0.155.2, 0.163.0, 0.170.0]
    steps:
      - name: Install Hugo CLI
        run: >
          wget -O ${{ runner.temp }}/hugo.deb
          https://github.com/gohugoio/hugo/releases/download/v${{ matrix.hugo }}/hugo_${{ matrix.hugo }}_linux-amd64.deb
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache processed images and fetched vendor files
        uses: actions/cache@v4
        with:
          path: |
            exampleSite/resources/_gen
            ${{ runner.temp }}/hugo_cache
          key: hugo-resources-${{ matrix.hugo }}-${{ hashFiles('exampleSite/content/**', 'exampleSite/hugo.toml', 'assets/**', 'data/**') }}
          restore-keys: hugo-resources-${{ matrix.hugo }}-

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        run: >
          hugo
          --minify
          --gc
          -s exampleSite
          --logLevel info
          --panicOnWarning

      # selfHosted fetches the vendor files with resources.GetRemote and
      # checks them against the SRI hashes in data/beautifulhugo/vendor.toml.
      - name: Build with Hugo (selfHosted)
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_PARAMS_SELFHOSTED: true
        run: >
          hugo
          --minify
          --gc
          -s exampleSite
          -d public-selfhosted
          --logLevel info
          --panicOnWarning
